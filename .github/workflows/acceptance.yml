name: acceptance

# Runs TestAccStack against the real CloudXino API: it creates a small stack (SSH key, the
# smallest server, firewall, load balancer, DNS zone and record), checks plan is empty and import
# works, then destroys everything. It costs money, so it only runs by hand (Actions -> acceptance
# -> Run workflow). Needs the secret CLOUDXINO_TOKEN: a developer API key of a test team.

on:
  workflow_dispatch:
    inputs:
      image:
        description: Image slug for the test server
        default: debian-13
      size:
        description: Size slug for the test server (keep it the smallest)
        default: s-1vcpu-1gb
      domain:
        description: DNS zone to create (blank = a random tfacc-*.com that is never delegated)
        default: ""
      api_url:
        description: API address
        default: https://cloudxino.com/api

permissions:
  contents: read

concurrency:
  group: acceptance
  cancel-in-progress: false

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.*"
          terraform_wrapper: false
      - run: go test ./internal/provider -run '^TestAcc' -v -count=1 -timeout 55m
        env:
          TF_ACC: "1"
          CLOUDXINO_TOKEN: ${{ secrets.CLOUDXINO_TOKEN }}
          CLOUDXINO_ACC_IMAGE: ${{ inputs.image }}
          CLOUDXINO_ACC_SIZE: ${{ inputs.size }}
          CLOUDXINO_ACC_DOMAIN: ${{ inputs.domain }}
          CLOUDXINO_API_URL: ${{ inputs.api_url }}
