name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.*"
          terraform_wrapper: false
      - run: go vet ./...
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      # Unit tests run real Terraform against an in-memory fake API; nothing is created.
      - run: go test -race ./...
      - name: docs are up to date
        run: |
          go generate ./...
          git diff --exit-code -- docs
      - run: terraform fmt -recursive -check examples

  # The same tests on OpenTofu.
  opentofu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_wrapper: false
      # setup-opentofu puts tofu in the tool cache, not a fixed path
      - run: TF_ACC_TERRAFORM_PATH="$(command -v tofu)" go test ./...
        env:
          TF_ACC_PROVIDER_NAMESPACE: hashicorp
          TF_ACC_PROVIDER_HOST: registry.opentofu.org
